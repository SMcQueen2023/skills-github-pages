<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">SAP BusinessObjects migration: evidence changed the Power BI plan</title>
  <desc id="description">A public reconstruction of the SAP BusinessObjects-to-Power BI proof of concept. A handful of reports were repaired and migrated, query plans and Power BI Service stress tests exposed data-size, semantic, and upstream constraints, and leadership accepted a change to enterprise IT-led development.</desc>
  <rect width="1200" height="720" fill="#F2F6F7"/>
  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="53" font-size="16" font-weight="700" letter-spacing="3">MIGRATION ASSESSMENT / REPORTING</text>
    <text x="48" y="128" font-size="58" font-weight="800" letter-spacing="-2">When the target did not fit</text>
    <text x="49" y="167" font-size="21">A working proof of concept was not a migration strategy for hundreds of reports.</text>
  </g>
  <path d="M48 190H1152M48 635H1152" stroke="#0C1722" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="48" y="231" font-size="16" font-weight="700" letter-spacing="2">01 / PROOF OF CONCEPT</text>
    <text x="433" y="231" font-size="16" font-weight="700" letter-spacing="2">02 / PLATFORM EVIDENCE</text>
    <text x="829" y="231" font-size="16" font-weight="700" letter-spacing="2">03 / DELIVERY DECISION</text>
  </g>
  <path d="M411 207V608M805 207V608" stroke="#0C1722" stroke-width="1" opacity=".55"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="48" y="292" font-size="30" font-weight="700">Fix and migrate</text>
    <text x="48" y="330" font-size="20">Broken Power BI POCs repaired</text>
    <text x="48" y="362" font-size="20">A handful of reports migrated</text>
    <text x="48" y="394" font-size="20">Wider portfolio still in question</text>
  </g>
  <path d="M48 433H381" stroke="#0C1722" stroke-width="1"/>
  <g fill="#0B707C" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
    <text x="48" y="466">LIMIT</text>
  </g>
  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="48" y="500">A handful of successes did not</text>
    <text x="48" y="527">prove a path for the full set.</text>
  </g>

  <rect x="433" y="267" width="349" height="180" fill="#0C1722"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F2F6F7">
    <text x="456" y="307" font-size="16" font-weight="700" letter-spacing="2">THE CRITICAL TEST</text>
    <text x="456" y="357" font-size="29" font-weight="700">Could Power BI</text>
    <text x="456" y="392" font-size="29" font-weight="700">carry the workload?</text>
  </g>
  <path d="M432 478H782" stroke="#0C1722" stroke-width="1"/>
  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <text x="433" y="510">EXPLAIN plans, Power BI Service</text>
    <text x="433" y="537">stress tests, dependency analysis.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="829" y="293" font-size="30" font-weight="700">Change the path</text>
    <text x="829" y="331" font-size="20">Power BI alone was unsuitable</text>
    <text x="829" y="363" font-size="20">for most reports</text>
  </g>
  <path d="M829 396H1152" stroke="#0B707C" stroke-width="5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="829" y="441" font-size="17" font-weight="700" letter-spacing="2">RECOMMENDATION ACCEPTED</text>
    <text x="829" y="474" font-size="18">Enterprise IT took development;</text>
    <text x="829" y="501" font-size="18">Accounting retained a business lead.</text>
    <text x="829" y="568" font-size="22" font-weight="700">Next delivery phase →</text>
  </g>

  <path d="M382 356H410M403 349L410 356L403 363M783 356H804M797 349L804 356L797 363" fill="none" stroke="#0B707C" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="48" y="675" font-size="15" letter-spacing="1">PUBLIC DECISION RECONSTRUCTION · NO PRODUCTION DATA OR UNDISCLOSED METRICS</text>
    <text x="1149" y="675" text-anchor="end" font-size="15" font-weight="700">SM</text>
  </g>
</svg>
