<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Reconciliation automation: thirty monthly source files to one report</title>
  <desc id="description">A schematic of thirty monthly 401(k) contribution files landing in Blob Storage, aggregation in Synapse and SQL, automated reconciliation with Python validation, and a report that confirms balanced totals or reveals a difference.</desc>
  <rect width="1200" height="720" fill="#F2F6F7"/>
  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="53" font-size="16" font-weight="700" letter-spacing="3">DECISION FILE 02 / AUTOMATION</text>
    <text x="48" y="128" font-size="58" font-weight="800" letter-spacing="-2">Thirty files. One monthly check.</text>
    <text x="49" y="167" font-size="21">Contribution totals are aggregated and reconciled automatically.</text>
  </g>
  <path d="M48 190H1152M48 624H1152" stroke="#0C1722" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0C1722">
    <text x="48" y="236" font-size="16" font-weight="700" letter-spacing="2">30 SOURCE FILES / MONTH</text>
    <text x="345" y="236" font-size="16" font-weight="700" letter-spacing="2">AGGREGATE</text>
    <text x="747" y="236" font-size="16" font-weight="700" letter-spacing="2">RECONCILE</text>
    <text x="48" y="297" font-size="34" font-weight="700">Collect</text>
    <text x="48" y="336" font-size="20">Monthly contribution files</text>
    <text x="48" y="365" font-size="20">Blob Storage</text>
    <text x="345" y="297" font-size="34" font-weight="700">Sum</text>
    <text x="345" y="336" font-size="20">Synapse + SQL</text>
    <text x="345" y="365" font-size="20">Contribution totals</text>
    <text x="747" y="297" font-size="34" font-weight="700">Compare</text>
    <text x="747" y="336" font-size="20">Python validation</text>
    <text x="747" y="365" font-size="20">Calculated difference</text>
  </g>
  <path d="M48 391H277M345 391H678M747 391H1152" stroke="#0C1722" stroke-width="2"/>
  <path d="M277 391H333M322 381L333 391L322 401M678 391H735M724 381L735 391L724 401" fill="none" stroke="#0B707C" stroke-width="4"/>

  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="437" font-size="17" font-weight="700">CHECKPOINT A</text>
    <text x="48" y="464" font-size="18">Were all files included?</text>
    <text x="345" y="437" font-size="17" font-weight="700">CHECKPOINT B</text>
    <text x="345" y="464" font-size="18">How were totals derived?</text>
    <text x="747" y="437" font-size="17" font-weight="700">CHECKPOINT C</text>
    <text x="747" y="464" font-size="18">Do the amounts balance?</text>
  </g>

  <path d="M965 392V516" fill="none" stroke="#0B707C" stroke-width="4"/>
  <path d="M955 506L965 516L975 506" fill="none" stroke="#0B707C" stroke-width="4"/>
  <rect x="747" y="526" width="405" height="76" fill="#0C1722"/>
  <g fill="#F2F6F7" font-family="Arial, Helvetica, sans-serif">
    <text x="769" y="557" font-size="19" font-weight="700" letter-spacing="1">RECONCILIATION REPORT</text>
    <text x="769" y="584" font-size="17">Balanced totals or a visible difference.</text>
  </g>
  <path d="M48 528H679" stroke="#0C1722" stroke-width="1"/>
  <g fill="#0C1722" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="558" font-size="17" font-weight="700" letter-spacing="1">DESIGN CHOICE</text>
    <text x="48" y="589" font-size="19">Automate the math across all 30 files.</text>
    <text x="48" y="668" font-size="15" letter-spacing="1">SANITIZED CONTROL FLOW · NO TRANSACTION RECORDS OR UNDISCLOSED RESULTS</text>
    <text x="1149" y="668" text-anchor="end" font-size="15" font-weight="700">SM / 02</text>
  </g>
</svg>
