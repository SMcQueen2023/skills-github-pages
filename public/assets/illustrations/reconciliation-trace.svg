<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Reconciliation automation: a visible exception and control trace</title>
  <desc id="description">A schematic of controlled file landing in Blob Storage, reconciliation in Synapse and SQL, and Python validation. The path separates reviewed exceptions from the main result, with checkpoints at each stage so a reviewer can inspect what entered, how it changed, and why a discrepancy needs attention.</desc>
  <rect width="1200" height="720" fill="#EFEDE5"/>
  <g fill="#171B1A" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="53" font-size="16" font-weight="700" letter-spacing="3">DECISION FILE 02 / AUTOMATION</text>
    <text x="48" y="128" font-size="58" font-weight="800" letter-spacing="-2">Automation you can audit</text>
    <text x="49" y="167" font-size="21">Every handoff leaves a place to inspect the work.</text>
  </g>
  <path d="M48 190H1152M48 624H1152" stroke="#171B1A" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#171B1A">
    <text x="48" y="236" font-size="16" font-weight="700" letter-spacing="2">INPUT</text>
    <text x="345" y="236" font-size="16" font-weight="700" letter-spacing="2">TRANSFORM + MATCH</text>
    <text x="747" y="236" font-size="16" font-weight="700" letter-spacing="2">VALIDATE</text>
    <text x="48" y="297" font-size="34" font-weight="700">Source files</text>
    <text x="48" y="336" font-size="20">Controlled landing</text>
    <text x="48" y="365" font-size="20">Blob Storage</text>
    <text x="345" y="297" font-size="34" font-weight="700">Reconcile</text>
    <text x="345" y="336" font-size="20">Synapse + SQL</text>
    <text x="345" y="365" font-size="20">Repeatable matching stages</text>
    <text x="747" y="297" font-size="34" font-weight="700">Check</text>
    <text x="747" y="336" font-size="20">Python validation</text>
    <text x="747" y="365" font-size="20">Exception shaping</text>
  </g>
  <path d="M48 391H277M345 391H678M747 391H1152" stroke="#171B1A" stroke-width="2"/>
  <path d="M277 391H333M322 381L333 391L322 401M678 391H735M724 381L735 391L724 401" fill="none" stroke="#EB4B31" stroke-width="4"/>

  <g fill="#171B1A" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="437" font-size="17" font-weight="700">CHECKPOINT A</text>
    <text x="48" y="464" font-size="18">What entered?</text>
    <text x="345" y="437" font-size="17" font-weight="700">CHECKPOINT B</text>
    <text x="345" y="464" font-size="18">How was it transformed?</text>
    <text x="747" y="437" font-size="17" font-weight="700">CHECKPOINT C</text>
    <text x="747" y="464" font-size="18">Why did a record diverge?</text>
  </g>

  <path d="M965 392V516" fill="none" stroke="#EB4B31" stroke-width="4"/>
  <path d="M955 506L965 516L975 506" fill="none" stroke="#EB4B31" stroke-width="4"/>
  <rect x="747" y="526" width="405" height="76" fill="#171B1A"/>
  <g fill="#EFEDE5" font-family="Arial, Helvetica, sans-serif">
    <text x="769" y="557" font-size="19" font-weight="700" letter-spacing="1">EXCEPTION / HUMAN REVIEW</text>
    <text x="769" y="584" font-size="17">Discrepancies remain visible and explainable.</text>
  </g>
  <path d="M48 528H679" stroke="#171B1A" stroke-width="1"/>
  <g fill="#171B1A" font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="558" font-size="17" font-weight="700" letter-spacing="1">DESIGN CHOICE</text>
    <text x="48" y="589" font-size="19">Separate stages so failure and recovery stay legible.</text>
    <text x="48" y="668" font-size="15" letter-spacing="1">SANITIZED CONTROL FLOW · NO TRANSACTION RECORDS OR UNDISCLOSED RESULTS</text>
    <text x="1149" y="668" text-anchor="end" font-size="15" font-weight="700">SM / 02</text>
  </g>
</svg>
